name: CI

# Read-only: CI builds and tests, and uploads the release ZIP as a workflow
# artifact. It never creates tags or GitHub Releases (docs/RELEASING.md).
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # The built extension in real Chromium against the local fake ChatGPT page
  # (e2e/extension.e2e.mjs), including the es-ES page variant. It does not
  # prove compatibility with the live site; see docs/LIVE_VALIDATION.md.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # The exact artifact users would install: package, unzip, test that.
      - name: Package the release ZIP
        run: npm run package

      - name: Browser end-to-end test on the unzipped release ZIP
        run: |
          mkdir -p "$RUNNER_TEMP/extension"
          unzip -q release/*.zip -d "$RUNNER_TEMP/extension"
          EXTENSION_DIR="$RUNNER_TEMP/extension" node e2e/extension.e2e.mjs

      - name: Upload the tested release ZIP (artifact only, not a release)
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-autopilot-release-zip
          path: release/*.zip
          if-no-files-found: error
          retention-days: 30
